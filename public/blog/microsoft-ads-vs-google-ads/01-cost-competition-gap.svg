<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14161f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <text x="450" y="46" text-anchor="middle" fill="#6b7280" font-size="15" letter-spacing="1.5" font-weight="600">2026 BENCHMARK DATA</text>
  <text x="450" y="82" text-anchor="middle" fill="#14161f" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="700">Cost &amp; Competition, Side by Side</text>

  <!-- Google card -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="120" width="360" height="300" rx="12" fill="#eaf1ff"/>
  </g>
  <g transform="translate(96,156)">
    <svg viewBox="0 0 48 48" width="44" height="44">
      <path fill="#4285F4" d="M24 9.5c3.4 0 6.4 1.2 8.8 3.5l6.6-6.6C35.5 2.6 30.1 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.7 6c1.8-5.5 7-9.7 13.7-9.7Z"/>
      <path fill="#34A853" d="M46.5 24.5c0-1.6-.1-3.2-.4-4.7H24v9h12.6c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-4 6.8-9.9 6.8-17.2Z"/>
      <path fill="#FBBC05" d="M10.3 28.5a14.5 14.5 0 0 1 0-9l-7.7-6a24 24 0 0 0 0 21l7.7-6Z"/>
      <path fill="#EA4335" d="M24 48c6.1 0 11.3-2 15-5.5l-7.3-5.7c-2 1.4-4.7 2.2-7.7 2.2-6.6 0-12.2-4.5-14.2-10.5l-7.7 6C6.5 42.6 14.6 48 24 48Z"/>
    </svg>
  </g>
  <text x="156" y="186" fill="#14161f" font-size="19" font-weight="700">Google Ads</text>

  <text x="96" y="248" fill="#2563eb" font-size="40" font-family="Georgia, 'Times New Roman', serif" font-weight="700">$2.85&#8211;$5.26</text>
  <text x="96" y="272" fill="#6b7280" font-size="14">average cost per click</text>

  <line x1="96" y1="296" x2="384" y2="296" stroke="#e5e7eb" stroke-width="1"/>

  <text x="96" y="340" fill="#2563eb" font-size="40" font-family="Georgia, 'Times New Roman', serif" font-weight="700">~80%</text>
  <text x="96" y="364" fill="#6b7280" font-size="14">of US advertisers run it</text>
  <text x="96" y="386" fill="#14161f" font-size="13">Crowded auction, higher price to win the click</text>

  <!-- Microsoft card -->
  <g filter="url(#cardShadow)">
    <rect x="480" y="120" width="360" height="300" rx="12" fill="#eaf1ff"/>
  </g>
  <g transform="translate(516,156)">
    <svg viewBox="0 0 24 24" width="36" height="36">
      <rect x="1" y="1" width="10" height="10" fill="#F25022"/>
      <rect x="13" y="1" width="10" height="10" fill="#7FBA00"/>
      <rect x="1" y="13" width="10" height="10" fill="#00A4EF"/>
      <rect x="13" y="13" width="10" height="10" fill="#FFB900"/>
    </svg>
  </g>
  <text x="568" y="182" fill="#14161f" font-size="19" font-weight="700">Microsoft Ads</text>

  <text x="516" y="248" fill="#2563eb" font-size="40" font-family="Georgia, 'Times New Roman', serif" font-weight="700">$1.50&#8211;$2.80</text>
  <text x="516" y="272" fill="#6b7280" font-size="14">average cost per click</text>

  <line x1="516" y1="296" x2="804" y2="296" stroke="#e5e7eb" stroke-width="1"/>

  <text x="516" y="340" fill="#2563eb" font-size="40" font-family="Georgia, 'Times New Roman', serif" font-weight="700">~36%</text>
  <text x="516" y="364" fill="#6b7280" font-size="14">of US advertisers run it</text>
  <text x="516" y="386" fill="#14161f" font-size="13">Thinner auction, lower price to win the click</text>

  <!-- Bottom highlight strip -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="454" width="780" height="76" rx="12" fill="#2563eb"/>
  </g>
  <text x="450" y="486" text-anchor="middle" fill="#ffffff" font-size="22" font-family="Georgia, 'Times New Roman', serif" font-weight="700">25&#8211;40% cheaper clicks on Microsoft</text>
  <text x="450" y="510" text-anchor="middle" fill="#eaf1ff" font-size="13">Fewer advertisers bidding, not a smarter algorithm</text>

  <text x="450" y="550" text-anchor="middle" fill="#6b7280" font-size="11">Sources: WordStream/LocaliQ, BrightBid, Lionheart, Improvado, 2026 benchmark reports. Advertiser share is an industry estimate. kseniiashermin.com</text>
</svg>

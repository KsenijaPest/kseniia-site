<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cardShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14161f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <text x="450" y="46" text-anchor="middle" fill="#6b7280" font-size="15" letter-spacing="1.5" font-weight="600">HOW I KEEP AN ACCOUNT CLEAN</text>
  <text x="450" y="82" text-anchor="middle" fill="#14161f" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="700">The Weekly Microsoft Ads Check</text>

  <!-- 3 cards, centered -->
  <!-- Card 1 -->
  <g filter="url(#cardShadow3)">
    <rect x="125" y="130" width="190" height="290" rx="12" fill="#eaf1ff"/>
  </g>
  <text x="150" y="172" fill="#2563eb" font-size="34" font-family="Georgia, 'Times New Roman', serif" font-weight="700">01</text>
  <g transform="translate(150,192)" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="34" height="26" rx="3"/>
    <line x1="6" y1="9" x2="28" y2="9"/>
    <line x1="6" y1="15" x2="22" y2="15"/>
    <line x1="6" y1="21" x2="26" y2="21"/>
  </g>
  <text x="150" y="256" fill="#14161f" font-size="15" font-weight="700">Publisher report</text>
  <text x="150" y="278" fill="#6b7280" font-size="12.5">Pull the Website URL</text>
  <text x="150" y="294" fill="#6b7280" font-size="12.5">(Publisher) report weekly,</text>
  <text x="150" y="310" fill="#6b7280" font-size="12.5">not monthly</text>

  <!-- Card 2 -->
  <g filter="url(#cardShadow3)">
    <rect x="355" y="130" width="190" height="290" rx="12" fill="#eaf1ff"/>
  </g>
  <text x="380" y="172" fill="#2563eb" font-size="34" font-family="Georgia, 'Times New Roman', serif" font-weight="700">02</text>
  <g transform="translate(380,192)" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="13" cy="13" r="12"/>
    <line x1="9" y1="13" x2="17" y2="13"/>
    <line x1="13" y1="9" x2="13" y2="17"/>
    <line x1="30" y1="30" x2="26" y2="26"/>
  </g>
  <text x="380" y="256" fill="#14161f" font-size="15" font-weight="700">Negative site list</text>
  <text x="380" y="278" fill="#6b7280" font-size="12.5">Add junk placements to a</text>
  <text x="380" y="294" fill="#6b7280" font-size="12.5">shared exclusion list at the</text>
  <text x="380" y="310" fill="#6b7280" font-size="12.5">manager account level</text>

  <!-- Card 3 -->
  <g filter="url(#cardShadow3)">
    <rect x="585" y="130" width="190" height="290" rx="12" fill="#eaf1ff"/>
  </g>
  <text x="610" y="172" fill="#2563eb" font-size="34" font-family="Georgia, 'Times New Roman', serif" font-weight="700">03</text>
  <g transform="translate(610,192)" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 26 L11 14 L19 20 L34 2"/>
    <path d="M25 2 L34 2 L34 11"/>
  </g>
  <text x="610" y="256" fill="#14161f" font-size="15" font-weight="700">Search terms</text>
  <text x="610" y="278" fill="#6b7280" font-size="12.5">Review at least weekly,</text>
  <text x="610" y="294" fill="#6b7280" font-size="12.5">more during a launch or a</text>
  <text x="610" y="310" fill="#6b7280" font-size="12.5">budget increase</text>

  <text x="450" y="450" text-anchor="middle" fill="#14161f" font-size="14" font-weight="700">This weekly cadence is what keeps a Microsoft Ads account clean.</text>

  <text x="450" y="498" text-anchor="middle" fill="#6b7280" font-size="11">kseniiashermin.com, Microsoft Ads management</text>
</svg>
